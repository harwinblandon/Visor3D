databases:
  - name: h-geovisor-db
    plan: free
    databaseName: h_geovisor
    user: h_geovisor

services:
  - type: web
    name: h-geovisor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: h-geovisor-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false
